    <path d="M 1280 396 C 1178 372, 1118 312, 1052 252" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="2 11"/>
    <path d="M 1218 8 C 1168 68, 1122 128, 1058 184" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="2 11"/>
    <path d="M 1108 0 C 1096 68, 1080 132, 1056 180" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="2 12"/>
