    <text x="80" y="278" font-size="27" font-weight="600" fill="#A5B4FC">吸纳众 Skill 之长，凝练识见以明判</text>

    <text x="80" y="326" font-size="17" fill="#9D8CC8" letter-spacing="0.5">Absorb the strengths of many skills. Distill insight. Sharpen judgment.</text>

    <text x="80" y="372" font-size="15" fill="#6D5B8F" letter-spacing="1">SEARCH  ·  READ  ·  DISTILL  ·  TEACH  ·  DELIVER</text>
