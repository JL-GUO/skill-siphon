<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="吸星大法 Skill Siphon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120A22"/>
      <stop offset="0.55" stop-color="#221440"/>
      <stop offset="1" stop-color="#150D28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.48" r="0.55">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#5EEAD4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#8B7CF6"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#5EEAD4"/>
